<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#f8fafc"/>

  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">EVE Healthcare — Backend Architecture</text>
  <text x="600" y="64" text-anchor="middle" font-size="13" fill="#64748b">Node.js · Express · Prisma · PostgreSQL · JWT · Zod · Docker</text>

  <!-- Client -->
  <rect x="500" y="95" width="200" height="55" rx="8" fill="#1e293b"/>
  <text x="600" y="128" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600">Client (Postman / UI)</text>

  <line x1="600" y1="150" x2="600" y2="185" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Express App shell -->
  <rect x="150" y="190" width="900" height="120" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="600" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Express App</text>

  <rect x="180" y="228" width="260" height="60" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="310" y="252" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">JWT Auth Middleware</text>
  <text x="310" y="270" text-anchor="middle" font-size="11" fill="#334155">Verifies Bearer token → req.user</text>

  <rect x="470" y="228" width="260" height="60" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="600" y="252" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Zod Validation</text>
  <text x="600" y="270" text-anchor="middle" font-size="11" fill="#334155">Validates request body/params</text>

  <rect x="760" y="228" width="260" height="60" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="890" y="252" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Swagger / OpenAPI</text>
  <text x="890" y="270" text-anchor="middle" font-size="11" fill="#334155">Docs served at /api-docs</text>

  <line x1="600" y1="310" x2="600" y2="345" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Route groups -->
  <rect x="80" y="350" width="1040" height="80" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="600" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Route Handlers (/api/v1)</text>

  <g font-size="11.5" fill="#166534">
    <rect x="105" y="382" width="180" height="36" rx="5" fill="#dcfce7"/>
    <text x="195" y="404" text-anchor="middle">Auth (signup, login)</text>

    <rect x="300" y="382" width="180" height="36" rx="5" fill="#dcfce7"/>
    <text x="390" y="404" text-anchor="middle">Centres (CRUD)</text>

    <rect x="495" y="382" width="180" height="36" rx="5" fill="#dcfce7"/>
    <text x="585" y="404" text-anchor="middle">Tests (per centre)</text>

    <rect x="690" y="382" width="180" height="36" rx="5" fill="#dcfce7"/>
    <text x="780" y="404" text-anchor="middle">Bookings + Slots</text>

    <rect x="885" y="382" width="205" height="36" rx="5" fill="#dcfce7"/>
    <text x="987" y="404" text-anchor="middle">Payments + Webhook</text>
  </g>

  <line x1="600" y1="430" x2="600" y2="465" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Service layer -->
  <rect x="80" y="470" width="1040" height="140" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="600" y="492" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Service Layer (business logic)</text>

  <rect x="120" y="505" width="440" height="90" rx="6" fill="#ffedd5" stroke="#fb923c"/>
  <text x="340" y="527" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7c2d12">Booking Service</text>
  <text x="340" y="546" text-anchor="middle" font-size="11" fill="#334155">Validates centre/test match, rejects past times,</text>
  <text x="340" y="562" text-anchor="middle" font-size="11" fill="#334155">SERIALIZABLE transaction prevents double-booking</text>
  <text x="340" y="578" text-anchor="middle" font-size="11" fill="#334155">a slot (P2034 conflict → 409)</text>

  <rect x="620" y="505" width="440" height="90" rx="6" fill="#ffedd5" stroke="#fb923c"/>
  <text x="840" y="527" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7c2d12">Payment Service</text>
  <text x="840" y="546" text-anchor="middle" font-size="11" fill="#334155">Owner + status checks before charging,</text>
  <text x="840" y="562" text-anchor="middle" font-size="11" fill="#334155">webhook handler is idempotent via unique</text>
  <text x="840" y="578" text-anchor="middle" font-size="11" fill="#334155">providerEventId inside a DB transaction</text>

  <line x1="600" y1="610" x2="600" y2="645" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Prisma -->
  <rect x="420" y="650" width="360" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="600" y="681" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Prisma ORM</text>

  <line x1="600" y1="700" x2="600" y2="735" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Postgres -->
  <rect x="420" y="740" width="360" height="55" rx="8" fill="#0f172a"/>
  <text x="600" y="774" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">PostgreSQL</text>

  <!-- Payment provider side flow -->
  <rect x="900" y="650" width="260" height="55" rx="8" fill="#7c3aed"/>
  <text x="1030" y="683" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">Simulated Payment Provider</text>

  <path d="M 900 677 L 780 570" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,4"/>
  <text x="900" y="640" text-anchor="middle" font-size="10.5" fill="#7c3aed" font-weight="600">POST /payments/webhooks</text>

  <text x="600" y="830" text-anchor="middle" font-size="11.5" fill="#64748b">Dotted arrow = webhook event delivery (idempotent — safe to retry/duplicate)</text>
  <text x="600" y="850" text-anchor="middle" font-size="11.5" fill="#64748b">Solid arrows = synchronous request/response flow through the stack</text>
</svg>
